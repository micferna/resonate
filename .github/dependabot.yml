version: 2

updates:
  # Dépendances Gradle. Dependabot sait éditer gradle/libs.versions.toml et ouvre
  # une pull request par mise à jour, que la CI valide avant toute fusion.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dépendances]
    groups:
      # Ces familles se versionnent ensemble : les séparer produirait des pull
      # requests qui ne compilent pas isolément.
      androidx-compose:
        patterns:
          - 'androidx.compose*'
      androidx-media3:
        patterns:
          - 'androidx.media3:*'
      kotlin:
        patterns:
          - 'org.jetbrains.kotlin*'
          - 'com.google.devtools.ksp*'
    ignore:
      # KSP sort après Kotlin et peut donc rester en retard d'une version. Ce
      # décalage est le plus souvent sans conséquence — vérifié pour Kotlin
      # 2.4.10 avec KSP 2.3.10. On ne bloque donc pas les montées mineures : la
      # CI compile, teste et analyse chaque pull request, et c'est elle qui doit
      # trancher. Seul le majeur, qui demande une relecture, reste manuel.
      - dependency-name: 'org.jetbrains.kotlin*'
        update-types: [version-update:semver-major]

  # Les actions GitHub sont du code exécuté avec accès au dépôt : elles méritent
  # la même surveillance que les dépendances applicatives.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [ci]
