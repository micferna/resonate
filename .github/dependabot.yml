version: 2

updates:
  # Dépendances Gradle. Dependabot sait éditer gradle/libs.versions.toml et ouvre
  # une pull request par mise à jour, que la CI valide avant toute fusion.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dépendances]
    groups:
      # Ces familles se versionnent ensemble : les séparer produirait des pull
      # requests qui ne compilent pas isolément.
      androidx-compose:
        patterns:
          - 'androidx.compose*'
      androidx-media3:
        patterns:
          - 'androidx.media3:*'
      kotlin:
        patterns:
          - 'org.jetbrains.kotlin*'
          - 'com.google.devtools.ksp*'
    ignore:
      # Kotlin ne peut monter qu'accompagné du KSP correspondant, et KSP sort
      # toujours après. Une montée 2.3 -> 2.4 proposée seule casse la génération
      # de code de Room et Hilt : les bumps mineurs sont donc bloqués au même
      # titre que les majeurs, et la montée se fait à la main une fois les deux
      # versions publiées. (Vécu : la PR #6 proposait exactement cela.)
      - dependency-name: 'org.jetbrains.kotlin*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: 'org.jetbrains.kotlin.plugin*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Les actions GitHub sont du code exécuté avec accès au dépôt : elles méritent
  # la même surveillance que les dépendances applicatives.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [ci]
