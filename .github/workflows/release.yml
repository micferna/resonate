name: Release

# Publier une version : pousser un tag `vX.Y.Z` dont le numéro correspond au
# `appVersionName` de app/build.gradle.kts. Le workflow refuse de continuer si
# les deux divergent — une Release annonçant une version que l'APK ne porte pas
# ferait boucler indéfiniment l'updater des utilisateurs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Compiler, signer et publier
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Installer le JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Vérifier l'intégrité du wrapper Gradle
        uses: gradle/actions/wrapper-validation@v6.2.0

      - name: Vérifier que le tag correspond à la version compilée
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${TAG_NAME#v}"
          declared=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          echo "Tag : $tag_version — déclaré dans le build : $declared"
          if [ "$tag_version" != "$declared" ]; then
            echo "::error::Le tag $TAG_NAME ne correspond pas à appVersionName ($declared)." \
                 "Corrigez app/build.gradle.kts, ou reposez le tag."
            exit 1
          fi

      - name: Tests et analyse statique
        run: ./gradlew testReleaseUnitTest lintRelease --no-daemon

      - name: Restaurer le magasin de clés
        env:
          KEYSTORE_BASE64: ${{ secrets.RESONATE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Le secret RESONATE_KEYSTORE_BASE64 est absent." \
                 "Sans lui, aucun APK signé ne peut être produit."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/resonate.jks"

      - name: Compiler l'APK signé
        env:
          RESONATE_KEYSTORE_PATH: ${{ runner.temp }}/resonate.jks
          RESONATE_KEYSTORE_PASSWORD: ${{ secrets.RESONATE_KEYSTORE_PASSWORD }}
          RESONATE_KEY_ALIAS: ${{ secrets.RESONATE_KEY_ALIAS }}
          RESONATE_KEY_PASSWORD: ${{ secrets.RESONATE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK et calculer son empreinte
        id: package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$src" ]; then
            echo "::error::Aucun APK produit."
            exit 1
          fi
          mkdir -p dist
          name="resonate-${version}.apk"
          cp "$src" "dist/$name"
          # L'app vérifie cette empreinte avant d'installer la mise à jour.
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "apk_name=$name" >> "$GITHUB_OUTPUT"
          cat "dist/$name.sha256"

      - name: Vérifier la signature de l'APK
        env:
          APK_NAME: ${{ steps.package.outputs.apk_name }}
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "dist/$APK_NAME"

      - name: Publier la Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/*.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
