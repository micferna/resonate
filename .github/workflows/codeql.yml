name: CodeQL

# Analyse de sécurité du code Kotlin/Java : injections, secrets en dur, mauvais
# usages de la cryptographie, chemins de données non validés. Complémentaire de
# Dependabot, qui surveille les vulnérabilités des dépendances, pas notre code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Une passe hebdomadaire : de nouvelles règles apparaissent régulièrement et
    # peuvent révéler un problème dans du code qui n'a pas bougé.
    - cron: '30 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyser le code Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Installer le JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          # `security-extended` plutôt que `security-and-quality` : les deux
          # couvrent exactement les mêmes règles de sécurité. La seconde y ajoute
          # des règles de qualité écrites pour Java, qui se déclenchent sur des
          # artefacts de la traduction Kotlin -> Java et sur le code généré par
          # KSP — sans qu'aucune modification du source ne les éteigne (vérifié).
          # La qualité du code est couverte par Android Lint, en warningsAsErrors.
          #
          # À noter : les filtres `paths-ignore` d'un fichier de configuration
          # sont sans effet ici. CodeQL ne les applique pas aux langages compilés
          # en build-mode manuel — ce qui est analysé est ce qui est compilé.
          queries: security-extended

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compiler
        # `--rerun-tasks` et `--no-build-cache` sont indispensables : sans eux, un
        # cache Gradle chaud rend la compilation sans objet, aucun compilateur ne
        # s'exécute, et CodeQL échoue sur « could not process any code written in
        # Java/Kotlin ». L'analyse n'observe que ce qui est réellement compilé.
        run: ./gradlew assembleDebug --no-daemon --rerun-tasks --no-build-cache

      - name: Analyser
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
